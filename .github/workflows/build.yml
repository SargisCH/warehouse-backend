name: Backend CI

on:
  push:
    branches:
      - '**'        # matches every branch
      - '!dev'      # excludes dev
      - '!master'   # excludes master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run build task
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand
